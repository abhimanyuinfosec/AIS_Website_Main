services:
  # ──────────────────────────────────────────────
  # Backend REST API Service (Render)
  # ──────────────────────────────────────────────
  - type: web
    name: ais-backend
    runtime: node
    plan: starter # or free
    rootDir: server
    buildCommand: npm install && npx prisma generate
    startCommand: npm run start:prod
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000

      # Neon / PostgreSQL connection string (set manually in Render dashboard)
      - key: DATABASE_URL
        sync: false

      # CORS — comma-separated list of allowed frontend origins (no trailing slash)
      # e.g. https://abhimanyuinfosec.vercel.app,https://abhimanyuinfosec.com
      - key: CORS_ORIGIN
        sync: false

      # JWT Secrets — set manually in Render dashboard to stable 64-char hex strings.
      # Use: node -e "console.log(require('crypto').randomBytes(64).toString('hex'))"
      # WARNING: Using generateValue rotates secrets on every deploy, invalidating all JWTs.
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: JWT_ACCESS_EXPIRY
        value: 15m
      - key: JWT_REFRESH_EXPIRY
        value: 7d

      # Google OAuth 2.0 (set in Render dashboard)
      # Authorized redirect URI: https://<BACKEND_URL>/api/auth/google/callback
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false

      # GitHub OAuth 2.0 (set in Render dashboard)
      # Authorization callback URL: https://<BACKEND_URL>/api/auth/github/callback
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false

      # OAuth redirect URLs — REQUIRED for correct login/callback flows
      # FRONTEND_URL: your Vercel/Cloudflare frontend URL (no trailing slash)
      # BACKEND_URL:  your Render backend URL (no trailing slash)
      - key: FRONTEND_URL
        sync: false
      - key: BACKEND_URL
        sync: false

      # Disable dev-mock OAuth simulation in production
      - key: ALLOW_DEV_OAUTH
        value: "false"

      # Initial admin seed credentials (used only when running: npm run db:seed)
      # Set these in Render dashboard, then run db:seed from the Render Shell once.
      - key: SEED_ADMIN_EMAIL
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false
      - key: SEED_ADMIN_NAME
        sync: false

  # ──────────────────────────────────────────────
  # Frontend Static Site (Render) — optional if using Vercel
  # ──────────────────────────────────────────────
  - type: web
    name: ais-frontend
    runtime: static
    plan: free
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # Full URL to the backend API including /api suffix
      # e.g. https://ais-backend.onrender.com/api
      - key: VITE_API_URL
        sync: false
