name: Keep Backend Alive

on:
  schedule:
    # Ping every 10 minutes to reliably keep Render Free tier awake (idle limit is 15 min)
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allows manual run anytime from GitHub Actions tab

jobs:
  keepalive:
    name: Ping Render Web Service
    runs-on: ubuntu-latest
    steps:
      - name: Health Check Ping
        run: |
          echo "Sending keep-alive heartbeat to Render backend..."
          RESPONSE=$(curl -s -L -w "\nHTTP_STATUS:%{http_code}\nTIME_TOTAL:%{time_total}s\n" --max-time 45 -A "GitHub-Actions-KeepAlive/1.0" "https://ais-website-main.onrender.com/api/health")
          echo "$RESPONSE"
